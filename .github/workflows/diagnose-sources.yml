name: Diagnose official legislative sources
on:
  push:
    paths:
      - '.github/workflows/diagnose-sources.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check upstream APIs
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const urls=[
            ['camara-latest','https://dadosabertos.camara.leg.br/api/v2/proposicoes?itens=5&pagina=1&ordenarPor=id&ordem=DESC'],
            ['camara-simple','https://dadosabertos.camara.leg.br/api/v2/proposicoes?itens=5'],
            ['camara-votes','https://dadosabertos.camara.leg.br/api/v2/votacoes?itens=5&pagina=1&ordem=DESC&ordenarPor=dataHoraRegistro'],
            ['senado-updated','https://legis.senado.leg.br/dadosabertos/materia/atualizadas.json?numdias=3'],
            ['senado-ongoing','https://legis.senado.leg.br/dadosabertos/materia/tramitando.json']
          ];
          for(const [name,url] of urls){
            try{
              const started=Date.now();
              const response=await fetch(url,{headers:{'Accept':'application/json','User-Agent':'RadarLegislativoBrasil/0.2'},signal:AbortSignal.timeout(16000)});
              const contentType=response.headers.get('content-type');
              const data=await response.text();
              let j;try{j=JSON.parse(data)}catch{}
              const normalized=name==='senado-updated'?require('./api/_lib/client').extractSenado(j):[];
              let example=null; if(name==='senado-updated'){
                const x=j?.ListaMateriasAtualizadas; example={innerKeys:Object.keys(x||{}),matterCollectionKeys:Object.keys(x?.Materias||x?.Materia||x?.MateriasAtualizadas||{}).slice(0,12),one:JSON.stringify(x?.Materias||x?.Materia||x?.MateriasAtualizadas||{}).slice(0,600)};
              }
              console.log(JSON.stringify({name,status:response.status,ms:Date.now()-started,contentType,length:data.length,topKeys:Object.keys(j||{}).slice(0,12),normalizedCount:normalized.length,normalizedSample:normalized[0]||null,example,sample:data.slice(0,160)}));
            }catch(e){console.log(JSON.stringify({name,error:e.message,cause:e.cause?.message||null}));}
          }
          NODE
