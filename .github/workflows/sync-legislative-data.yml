name: Atualizar dados legislativos
on:
  push:
    paths:
      - 'scripts/collect.js'
      - 'api/_lib/autoria.js'
      - 'scripts/archive.js'
      - 'scripts/ingest.js'
      - 'database/**'
      - '.github/workflows/sync-legislative-data.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
permissions:
  contents: write
concurrency:
  group: radar-dados-oficiais
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      HAS_DB: ${{ secrets.DATABASE_URL != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Consultar as APIs oficiais e gerar amostras verificáveis
        run: node scripts/collect.js
      - name: Importar dados no PostgreSQL quando configurado
        if: ${{ env.HAS_DB == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/ingest.js
      - name: Validar estrutura dos arquivos
        run: |
          node -e "const j=require('./data/latest.json');if(!Array.isArray(j.materias)||j.materias.length<10||j.materias.some(x=>!x.id||!x.tipo||!x.origem))process.exit(1);console.log('Materias verificadas:',j.materias.length)"
      - name: Publicar atualizações verificadas
        run: |
          git config user.name "radar-legislativo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/votacoes.json data/agenda.json data/archive/
          if git diff --cached --quiet; then
            echo "Nenhum arquivo alterado."
          else
            git commit -m "data: refresh official Câmara and Senado snapshots [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Amostras e histórico publicados no main."
                exit 0
              fi
              echo "Branch atualizada durante a publicação, repetindo ($attempt/3)."
              sleep 2
            done
            echo "Falha persistente ao publicar dados coletados."
            exit 1
          fi
