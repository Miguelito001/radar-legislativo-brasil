name: Atualizar o radar do dia
on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect.js'
      - 'api/_lib/daily.js'
      - 'day.js'
      - '.github/workflows/sync-legislative-data.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
permissions:
  contents: write
concurrency:
  group: radar-hoje
  cancel-in-progress: false
jobs:
  synchronize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Consultar fontes oficiais para o dia de Brasília
        run: node scripts/collect.js
      - name: Publicar somente snapshot diário
        run: |
          git config user.name "radar-legislativo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/today.json
          if git diff --cached --quiet; then
            echo "Sem mudanças substantivas no radar do dia."
            exit 0
          fi
          git commit -m "data: refresh today's official legislative activity [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git reset --hard origin/main
              node scripts/collect.js
              git add data/today.json
              if git diff --cached --quiet; then exit 0; fi
              git commit -m "data: refresh today's official legislative activity [skip ci]"
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
